<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferreteria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Ferreteria</h1>
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active" data-section="Inicio"> Inicio</a></li>
                <li><a href="#" data-section="inventario"> Inventario</a></li>
                <li><a href="#" data-section="clientes"> Clientes</a></li>
                <li><a href="#" data-section="pos"> Punto de venta (POS)</a></li>
                <li><a href="#" data-section="ventas-dia">Ventas del Día</a></li>
                <li><a href="#" data-section="producto-mas-vendido">Top ventas</a></li>
            </ul>
            <!--   Botón de Cerrar Sesión -->
               <div style="padding: 20px; margin-top: auto;">
                <button type="button" id="btn-cerrar-sesion" style="width: 100%; padding: 11px 15px; background: linear-gradient(135deg, #16a34a, #22c55e); color: white; border-radius: 6px; font-weight: 600; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h2 id="section-title">Dashboard</h2>
                <div class="user-profile">
                    <span>Admin Ferreteria</span>
                </div>
            </header>
            <section class="content-body">
                <div class="card">
                    <h3> Bienvenido </h3>
                    <p> Selecciona una opcion del menu para administrar productos, clientes o realizar ventas.</p>
                </div>
            </section>
        </main>
    </div>
    <!-- Script de validación de sesión seguro -->
    <script>
        try {
            // Verificamos directamente si existe la clave en el localStorage
            const usuarioLogueado = localStorage.getItem('usuarioLogueado');
            
            if (!usuarioLogueado) {
                // Si no hay sesión, redirigimos al login de forma limpia
                window.location.href = './login.html';
            }
        } catch (error) {
            console.error("Error al validar la sesión:", error);
            window.location.href = './login.html';
        }
    </script>

    <!-- Script principal de la aplicación -->
    <script src="app.js"></script>
</body>
</html>
