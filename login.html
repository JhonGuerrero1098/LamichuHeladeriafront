<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Ferretería</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: #1e293b;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #475569;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-action {
            width: 100%;
            padding: 12px;
            background-color: #1e293b;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-action:hover {
            background-color: #334155;
        }
        .msg {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        #error-msg { color: #dc2626; }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- FORMULARIO DE LOGIN -->
        <div id="seccion-login">
            <h2>Ferretería - Iniciar Sesión</h2>
            <form id="form-login">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="admin@ferreteria.com">
                </div>
                <div class="form-group">
                    <label for="login-contrasena">Contraseña</label>
                    <input type="password" id="login-contrasena" required placeholder="********">
                </div>
                <button type="submit" class="btn-action">Ingresar</button>
                <p id="error-msg" class="msg"></p>
            </form>
        </div>
    </div>

    <script>
        // Lógica de Inicio de Sesión
        const formLogin = document.getElementById('form-login');
        const errorMsg = document.getElementById('error-msg');

        formLogin.addEventListener('submit', (e) => {
            e.preventDefault();
            errorMsg.textContent = '';
            
            const credentials = {
                email: document.getElementById('login-email').value,
                contrasena: document.getElementById('login-contrasena').value
            };

            fetch('https://localhost:7137/api/Usuarios/Login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(credentials)
            })
            .then(async response => {
                if (response.ok) {
                    const data = await response.json();
                    // Guardamos la información del usuario logueado (incluyendo rol)
                    localStorage.setItem('usuarioLogueado', JSON.stringify(data.usuario));
                    window.location.href = 'index.html';
                } else {
                    const errorText = await response.text();
                    errorMsg.textContent = errorText || 'Correo o contraseña incorrectos.';
                }
            })
            .catch(err => {
                console.error('Error:', err);
                errorMsg.textContent = 'Error de conexión con el servidor.';
            });
        });
    </script>

</body>
</html>
