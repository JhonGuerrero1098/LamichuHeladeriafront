<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Ferretería</title>
    <style>
    body {
    font-family: 'segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #0b0f19;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    color: #f3f4f6;
}

.login-card {
    background-color: #111827;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 0 1px 1px rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.03);
    width: 100%;
    max-width: 400px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.login-card h2 {
    margin-bottom: 20px;
    color: #f8fafc;
    text-align: center;
    font-size: 1.5rem;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    color: #94a3b8;
    font-weight: 500;
    font-size: 0.9rem;
}

.form-group input {
    width: 100%;
    padding: 10px 12px;
    background-color: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    box-sizing: border-box;
    color: #f3f4f6;
    font-size: 0.95rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.form-group input:focus {
    outline: none;
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
}

.btn-action {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #2563eb, #38bdf8);
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
}

.btn-action:hover {
    background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
    box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);
    transform: translateY(-1px);
}

.msg {
    text-align: center;
    margin-top: 15px;
    font-size: 0.9rem;
    color: #94a3b8;
}
        #error-msg { color: #dc2626; }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- FORMULARIO DE LOGIN -->
        <div id="seccion-login">
            <h2>Ferretería - Iniciar Sesión</h2>
            <form id="form-login">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="admin@ferreteria.com">
                </div>
                <div class="form-group">
                    <label for="login-contrasena">Contraseña</label>
                    <input type="password" id="login-contrasena" required placeholder="********">
                </div>
                <button type="submit" class="btn-action">Ingresar</button>
                <p id="error-msg" class="msg"></p>
            </form>
        </div>
    </div>

    <script>
        // Lógica de Inicio de Sesión
        const formLogin = document.getElementById('form-login');
        const errorMsg = document.getElementById('error-msg');

        formLogin.addEventListener('submit', (e) => {
            e.preventDefault();
            errorMsg.textContent = '';
            
            const credentials = {
                email: document.getElementById('login-email').value,
                contrasena: document.getElementById('login-contrasena').value
            };

            fetch('https://localhost:7137/api/Usuarios/Login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(credentials)
            })
            .then(async res => {
                if (res.ok) {
                    const data = await res.json();
                    
                    // Guardar la sesión y redirigir al panel principal
                    localStorage.setItem('usuarioLogueado', JSON.stringify(data.usuario));
                    window.location.href = 'index.html';
                } else {
                    const errorText = await res.text();
                    errorMsg.textContent = errorText || 'Correo o contraseña incorrectos.';
                }
            })
            .catch(err => {
                console.error('Error:', err);
                errorMsg.textContent = 'Error de conexión con el servidor.';
            });
        });
    </script>
  
    </script>
    

</body>
</html>
